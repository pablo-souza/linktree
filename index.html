<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#073b64">
    <meta name="description" content="Centro de Estudos John Knox — conhecimento, fé e formação.">
    <meta property="og:title" content="Centro de Estudos John Knox">
    <meta property="og:description" content="Conhecimento, fé e formação.">
    <meta property="og:image" content="./assets/brasao-john-knox.jpg">
    <title>Centro de Estudos John Knox</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main class="container">
      <section id="profile" class="profile" aria-labelledby="profile-title" hidden>
        <img id="profile-avatar" class="profile__avatar" src="./assets/brasao-john-knox.jpg" alt="" width="176" height="176">
        <div class="profile__ornament" aria-hidden="true"><span></span></div>
        <h1 id="profile-title" class="profile__title"></h1>
        <p id="profile-description" class="profile__description" hidden></p>
      </section>

      <section class="links" aria-label="Links">
        <div id="status" class="status" role="status" aria-live="polite">Carregando...</div>
        <div id="link-list" class="link-list" hidden></div>
        <button id="retry-button" class="retry-button" type="button" hidden>Tentar novamente</button>
      </section>

      <footer id="footer" class="footer" hidden></footer>
    </main>
  </body>
</html>
